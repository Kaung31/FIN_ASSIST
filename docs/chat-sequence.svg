<svg width="100%" viewBox="0 0 680 452" role="img" xmlns="http://www.w3.org/2000/svg">
<title>POST /chat request sequence</title>
<desc>A single /chat request: UI posts the question to the API, which calls rag_chat.answer, which calls the retriever; the retriever embeds the query via Azure OpenAI and runs a hybrid+semantic query against Azure AI Search, returns chunks; if none, the API declines; otherwise the API calls Azure OpenAI chat with the retrieved context and returns a QAResponse with answer and citations.</desc>
<defs>
<marker id="sah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#7d8694"/>
</marker>
<style>
text{font-family:var(--font-sans, ui-sans-serif, system-ui, -apple-system, sans-serif);}
.h1{fill:var(--color-text-primary,#11181c);font-size:18px;font-weight:700;}
.h2{fill:var(--color-text-secondary,#69707a);font-size:11px;}
.t-life{font-size:11px;font-weight:700;}
.az-tx{fill:#0c447c;} .lo-tx{fill:#222831;}
.azure{fill:#e6f1fb;stroke:#2f6fb0;stroke-width:1.4;}
.local{fill:#f1f3f5;stroke:#a4abb5;stroke-width:1.4;}
.life{stroke:#c4cad2;stroke-width:1.3;stroke-dasharray:3 4;}
.call{stroke:#7d8694;stroke-width:1.7;fill:none;}
.ret{stroke:#7d8694;stroke-width:1.5;fill:none;stroke-dasharray:6 4;}
.msg{fill:var(--color-text-primary,#2a2f36);font-size:9px;}
.msgf{font-family:var(--font-mono, ui-monospace, monospace);}
.note{fill:#fbe7d6;stroke:#c8843a;stroke-width:1.2;}
.note-tx{fill:#7a4d12;font-size:8.5px;}
.leg{fill:#7a8290;font-size:9px;}
@media (prefers-color-scheme:dark){
 .azure{fill:#11324f;stroke:#5aa0ea;} .local{fill:#2a2f36;stroke:#7b8490;}
 .az-tx{fill:#dcebfb;} .lo-tx{fill:#e7eaee;} .life{stroke:#454b54;}
 .call,.ret{stroke:#9aa3ae;} .msg{fill:#dfe3e8;} .leg{fill:#9aa3ae;}
 .note{fill:#3a2c18;stroke:#caa05f;} .note-tx{fill:#f0d8b4;}
}
</style>
</defs>

<text class="h1" x="20" y="26">POST /chat — request sequence</text>
<text class="h2" x="20" y="44">Grounded Q&amp;A: retrieve first, answer only from context, cite the chunks.</text>

<g><rect class="local" x="10" y="58" width="120" height="30" rx="7"/>
<text class="t-life lo-tx" x="70" y="77" text-anchor="middle">UI (Streamlit)</text></g>
<g><rect class="local" x="150" y="58" width="120" height="30" rx="7"/>
<text class="t-life lo-tx" x="210" y="77" text-anchor="middle">API · rag_chat</text></g>
<g><rect class="local" x="290" y="58" width="120" height="30" rx="7"/>
<text class="t-life lo-tx" x="350" y="77" text-anchor="middle">retriever</text></g>
<g><rect class="azure" x="430" y="58" width="120" height="30" rx="7"/>
<text class="t-life az-tx" x="490" y="77" text-anchor="middle">Azure OpenAI</text></g>
<g><rect class="azure" x="560" y="58" width="120" height="30" rx="7"/>
<text class="t-life az-tx" x="620" y="77" text-anchor="middle">AI Search</text></g>

<line class="life" x1="70" y1="88" x2="70" y2="402"/>
<line class="life" x1="210" y1="88" x2="210" y2="402"/>
<line class="life" x1="350" y1="88" x2="350" y2="402"/>
<line class="life" x1="490" y1="88" x2="490" y2="402"/>
<line class="life" x1="620" y1="88" x2="620" y2="402"/>

<text class="msg msgf" x="140" y="111" text-anchor="middle">POST /chat {question}</text>
<line class="call" x1="70" y1="116" x2="209" y2="116" marker-end="url(#sah)"/>
<text class="msg msgf" x="280" y="139" text-anchor="middle">answer() → search(…)</text>
<line class="call" x1="210" y1="144" x2="349" y2="144" marker-end="url(#sah)"/>
<text class="msg msgf" x="420" y="167" text-anchor="middle">embed_query(question)</text>
<line class="call" x1="350" y1="172" x2="489" y2="172" marker-end="url(#sah)"/>
<text class="msg" x="420" y="195" text-anchor="middle">1536-d vector</text>
<line class="ret" x1="490" y1="200" x2="351" y2="200" marker-end="url(#sah)"/>
<text class="msg" x="485" y="223" text-anchor="middle">hybrid (BM25 + vector) + semantic</text>
<line class="call" x1="350" y1="228" x2="619" y2="228" marker-end="url(#sah)"/>
<text class="msg" x="485" y="251" text-anchor="middle">top-k chunks + scores</text>
<line class="ret" x1="620" y1="256" x2="351" y2="256" marker-end="url(#sah)"/>
<text class="msg" x="280" y="279" text-anchor="middle">RetrievedChunks</text>
<line class="ret" x1="350" y1="284" x2="211" y2="284" marker-end="url(#sah)"/>

<g><rect class="note" x="150" y="296" width="230" height="22" rx="5"/>
<text class="note-tx" x="265" y="310" text-anchor="middle">if no chunks → grounded=false, decline</text></g>

<text class="msg msgf" x="350" y="335" text-anchor="middle">chat(system, context)</text>
<line class="call" x1="210" y1="340" x2="489" y2="340" marker-end="url(#sah)"/>
<text class="msg" x="350" y="363" text-anchor="middle">answer text</text>
<line class="ret" x1="490" y1="368" x2="211" y2="368" marker-end="url(#sah)"/>
<text class="msg" x="140" y="391" text-anchor="middle">QAResponse: answer + citations</text>
<line class="ret" x1="210" y1="396" x2="71" y2="396" marker-end="url(#sah)"/>

<line class="call" x1="20" y1="426" x2="44" y2="426" marker-end="url(#sah)"/>
<text class="leg" x="50" y="429">call</text>
<line class="ret" x1="100" y1="426" x2="124" y2="426" marker-end="url(#sah)"/>
<text class="leg" x="130" y="429">return</text>
<text class="leg" x="200" y="429">citations come from the retrieved chunks — no chunk, no claim.</text>
</svg>
